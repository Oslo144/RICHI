<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Grok Style GPS Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#000;
}

#map{
  width:100%;
  height:100vh;
}

/* PANEL */

#info{
  position:absolute;
  top:20px;
  left:20px;
  width:320px;

  background:rgba(10,10,10,0.85);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.08);

  border-radius:22px;

  padding:20px;

  color:white;

  z-index:999;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.6),
    inset 0 1px 1px rgba(255,255,255,0.05);
}

.logo{
  font-size:26px;
  font-weight:bold;
  margin-bottom:12px;
  letter-spacing:1px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:18px;

  color:#8bffb7;
  font-size:14px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#00ff88;

  box-shadow:
    0 0 10px #00ff88,
    0 0 20px #00ff88;
}

.card{
  background:rgba(255,255,255,0.04);

  border:1px solid rgba(255,255,255,0.05);

  border-radius:16px;

  padding:14px;

  margin-bottom:12px;
}

.label{
  font-size:12px;
  opacity:0.6;
  margin-bottom:6px;
}

.value{
  font-size:17px;
  font-weight:bold;
}

.device{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

.time{
  margin-top:10px;
  font-size:13px;
  opacity:0.7;
  line-height:1.6;
}

/* BOTONES */

.controls{
  position:absolute;
  top:20px;
  right:20px;

  display:flex;
  flex-direction:column;
  gap:12px;

  z-index:999;
}

.btn{
  width:55px;
  height:55px;

  border:none;
  border-radius:18px;

  background:rgba(15,15,15,0.85);

  color:white;

  font-size:20px;

  cursor:pointer;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.05);

  transition:0.2s;
}

.btn:hover{
  transform:scale(1.08);
  background:#111;
}

</style>
</head>
<body>

<div id="map"></div>

<div id="info">

  <div class="logo">
    RICHI GPS
  </div>

  <div class="status">
    <div class="dot"></div>
    En línea
  </div>

  <div class="device" id="deviceName">
    Esperando conexión...
  </div>

  <div class="card">
    <div class="label">
      LATITUD
    </div>

    <div class="value" id="latitud">
      ---
    </div>
  </div>

  <div class="card">
    <div class="label">
      LONGITUD
    </div>

    <div class="value" id="longitud">
      ---
    </div>
  </div>

  <div class="time" id="fecha">
    Sin datos
  </div>

</div>

<div class="controls">

  <!-- CAMBIAR MAPA -->
  <button class="btn" id="styleBtn">
    🗺️
  </button>

  <!-- CENTRAR -->
  <button class="btn" id="centerBtn">
    📍
  </button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyBz7WvBv4zR2MzGyQM71AO1XJfKGUrr2EI",
  authDomain: "richi-48550.firebaseapp.com",
  databaseURL: "https://richi-48550-default-rtdb.firebaseio.com",
  projectId: "richi-48550",
  storageBucket: "richi-48550.firebasestorage.app",
  messagingSenderId: "958178943196",
  appId: "1:958178943196:web:fdfb81cd04791f8a1b1419",
  measurementId: "G-2X6C7RG8KS"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

/* MAPBOX */

mapboxgl.accessToken =
'pk.eyJ1Ijoib2xkc2FrZSIsImEiOiJjbW0xZmwxaW0wOWc3Mm9xMnFjOWZsa3R5In0.0aVBPEccjfz0lLLpez-dhw';

/* ESTILOS */

const styles = [

  "mapbox://styles/mapbox/dark-v11",

  "mapbox://styles/mapbox/monochrome",

  "mapbox://styles/mapbox/satellite-streets-v12",

  "mapbox://styles/mapbox/light-v11"
];

let currentStyle = 0;

/* MAPA */

const map = new mapboxgl.Map({

  container:"map",

  style:styles[currentStyle],

  center:[-68.1193,-16.4897],

  zoom:13
});

let marker = null;

let firstLoad = true;

let lastLng = -68.1193;

let lastLat = -16.4897;

/* LEER TODOS LOS DISPOSITIVOS */

const ref =
  collection(db,"ubicaciones");

/* TIEMPO REAL */

onSnapshot(ref,(snapshot)=>{

  if(snapshot.empty){

    document.getElementById("deviceName")
      .innerHTML =
        "Sin dispositivos";

    return;
  }

  /* PRIMER DOCUMENTO */

  const data =
    snapshot.docs[0].data();

  const lat =
    parseFloat(data.latitud);

  const lng =
    parseFloat(data.longitud);

  if(isNaN(lat) || isNaN(lng)){
    return;
  }

  lastLat = lat;

  lastLng = lng;

  /* MARCADOR */

  if(!marker){

    marker =
      new mapboxgl.Marker({

        color:"#00ff88",

        scale:0.9
      })

      .setLngLat([lng,lat])

      .addTo(map);

  }else{

    marker.setLngLat([lng,lat]);
  }

  /* CENTRAR */

  if(firstLoad){

    map.flyTo({

      center:[lng,lat],

      zoom:17,

      speed:1.3
    });

    firstLoad = false;
  }

  /* FECHA */

  let fechaTexto =
    "Sin fecha";

  if(data.date){

    const fecha =
      new Date(
        data.date.seconds * 1000
      );

    fechaTexto =
      fecha.toLocaleString("es-BO",{

        timeZone:"America/La_Paz",

        dateStyle:"medium",

        timeStyle:"medium"
      });
  }

  /* UI */

  document.getElementById("deviceName")
    .innerHTML =
      data.deviceName || "Android";

  document.getElementById("latitud")
    .innerHTML =
      lat.toFixed(6);

  document.getElementById("longitud")
    .innerHTML =
      lng.toFixed(6);

  document.getElementById("fecha")
    .innerHTML =
      "Última actualización:<br>" +
      fechaTexto;

});

/* CAMBIAR MAPA */

document
.getElementById("styleBtn")
.addEventListener("click",()=>{

  currentStyle++;

  if(currentStyle >= styles.length){

    currentStyle = 0;
  }

  map.setStyle(
    styles[currentStyle]
  );
});

/* CENTRAR */

document
.getElementById("centerBtn")
.addEventListener("click",()=>{

  map.flyTo({

    center:[lastLng,lastLat],

    zoom:18,

    speed:1.4
  });
});

</script>

</body>
</html>
